<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divs + Spans</title>
    <style>
        p{color: rgb(255, 200, 132);}
        .emphasis{
            color:rgb(255, 84, 17); 
            text-decoration: underline; 
            font-family: monospace;
        }

    </style>
</head>
<body>
    <h1 style="background-color: rgba(137, 43, 226, 0.388);" class="emphasis">Header</h1>
    <div style="background-color: antiquewhite; text-align: center;">
    <h3><span style="color:cadetblue" class="emphasis">Smaller</span> Header</h3>

    <p>Paragraph 1</p>
    <p>Paragraph 2</p>
    
    </div>
    <img src="LinksImages\astartes.jpg" width="200px">

    
</body>
</html>
