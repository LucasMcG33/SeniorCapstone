<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>puppies!</title>
</head>
<body>
    <h1>Puppy Adoption Page</h1>
    <h2>Please enter your information to adopt a puppy and we'll email you back.</h2>
    <p>Please Note: First Name, Last Name, Password, and Email are required</p>
    <form>
        <label for="firstName">First Name:</label>
        <input type="text" name="firstName" placeholder="First Name" required>
        <label for="lastName">Last Name:</label>
        <input type="text" name="lastName" placeholder="Last Name" required>
        <br>
        <br>
        <label for="email">Email:</label>
        <input type="email" name="email" placeholder="name@email.com" required>
        <label for="password">Password:</label>
        <input type="password" name="password" placeholder="" required>

        <br>
        <p>Are you over the age of 18?</p>
        <label for="over18">Yes:</label>
        <input type="radio" name="age" value="over18" id="over18">
        <label for="under18">No:</label>
        <input type="radio" name="age" value="under18" id="under18">

        <p>Do you have a Credit Card or PayPal?</p>
        <select name="payment" required>
            <option value="credit">Credit Card</option>
            <option value="paypal">Paypal</option>
        </select>
        <br>
        <br>
        <input type="submit" value="Submit Feedback">

    </form>

</body>
</html>
