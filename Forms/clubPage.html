<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rowing Club Sign Up</title>
</head>
<body>
    <form>
        <input type="text" name="name" placeholder="Full Name">
        <input type="email" name="email" placeholder="Email">
        <input type="number" name="age" placeholder="Age">
        <p>What is your grade level?</p>
        <input type="radio" name="grade" value="8th"> 8th
        <input type="radio" name="grade" value="9th"> 9th
        <input type="radio" name="grade" value="10th"> 10th
        <input type="radio" name="grade" value="11th"> 11th
        <input type="radio" name="grade" value="12th"> 12th
        <br>
        <input type="submit" value="Sign Up">
    </form>
</body>
</html>
